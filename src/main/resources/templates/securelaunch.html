<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit the form</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1b2330;
      --muted: #5b6678;
      --primary: #1f5eff;
      --primary-hover: #1848c9;
      --border: #e2e6ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1420;
        --card: #182030;
        --text: #e8ecf3;
        --muted: #9aa5b8;
        --primary: #4c7dff;
        --primary-hover: #6a93ff;
        --border: #2a3448;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p  { color: var(--muted); font-size: 0.95rem; }

    .launch-btn {
      display: inline-block;
      margin: 28px 0 20px;
      padding: 14px 32px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .launch-btn:hover  { background: var(--primary-hover); }
    .launch-btn:active { transform: scale(0.98); }
    .launch-btn:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .help {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 0.85rem;
    }
    .help a { color: var(--primary); }
    .exam-info {
    margin-top: 24px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    text-align: left;
    }

    .info-row {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 14px;
        border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
        border-bottom: none;
    }

    .label {
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 10px 12px;
        font-size: 0.95rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        outline: none;
    }

    input:focus {
        border-color: var(--primary);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Start Your Exam</h1>
    <p>Enter your exam details and click the button below.</p>
    <form action="/exam" method="post">

        <div class="exam-info">

            <div class="info-row">
                <label class="label" for="clientId">Client ID</label>

                <input
                    id="clientId"
                    name="clientId"
                    type="text"
                    placeholder="Enter Client ID"
                    required
                />
            </div>

            <div class="info-row">
                <label class="label" for="templateCode">Template Code</label>

                <input
                    id="templateCode"
                    name="templateCode"
                    type="text"
                    placeholder="Enter Template Code"
                    required
                />
            </div>
        </div>

        <button type="submit" class="launch-btn">
            Submit
        </button>

    </form>
  </main>
</body>
</html>
